<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopEase Admin</title><link rel="stylesheet" href="/style.css"></head><body class="adminPage"><header><a class="logo" href="/">ShopEase<span>.</span> Admin</a><a href="/">View store ↗</a></header><main class="adminMain"><section id="loginBox" class="adminBox"><h1>Admin access</h1><form id="adminLogin"><input name="username" placeholder="Admin username" required><input name="password" type="password" placeholder="Admin password" required><button class="cta">Sign in</button></form><p id="adminError"></p></section><section id="dashboard" class="hidden"><h1>Store overview</h1><div class="stats"><div><b id="userCount">0</b><span>Customers</span></div><div><b id="orderCount">0</b><span>Orders</span></div><div><b id="productCount">0</b><span>Products</span></div></div><section class="adminBox"><h2>Add product</h2><form id="addProduct" class="productForm"><input name="name" placeholder="Product name" required><input name="price" type="number" min="1" placeholder="Price ₹" required><input name="category" placeholder="Category"><input name="stock" type="number" min="0" placeholder="Stock"><input name="image" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><button class="cta">Add product</button></form></section><section class="adminBox"><h2>Orders</h2><div class="tableWrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table></div></section><section class="adminBox"><h2>Customers</h2><div class="tableWrap"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="adminBox"><h2>Products</h2><div class="tableWrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th></tr></thead><tbody id="products"></tbody></table></div></section><button id="adminLogout" class="ghost">Log out</button></section></main><script src="/admin.js"></script></body></html>
